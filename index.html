<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Hidden Trio · Panel</title>
<style>
  :root { color-scheme:dark; --fondo:#0a1322; --caja:#111e33; --borde:#22344f; --texto:#e8eef7; --suave:#8fa3bd; --azul:#a6d9f5; --crema:#f8f3e6; --ok:#7fd6a0; --mal:#f08a7c; --espera:#f2cf7a; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--fondo); color:var(--texto); font:16px/1.45 "Segoe UI", system-ui, sans-serif; }
  header { padding:22px 20px 8px; max-width:1080px; margin:auto; display:flex; align-items:baseline; gap:16px; flex-wrap:wrap; }
  header h1 { margin:0; font-size:15px; letter-spacing:.42em; font-weight:400; color:var(--azul); }
  header span { color:var(--suave); font-size:14px; }
  nav { max-width:1080px; margin:auto; padding:8px 20px 0; display:flex; gap:6px; border-bottom:1px solid var(--borde); }
  nav button { background:none; border:0; color:var(--suave); font:inherit; padding:10px 14px; cursor:pointer; border-bottom:2px solid transparent; }
  nav button.activa { color:var(--crema); border-color:var(--azul); }
  main { max-width:1080px; margin:auto; padding:20px; }
  .caja { background:var(--caja); border:1px solid var(--borde); border-radius:12px; padding:18px; margin-bottom:18px; }
  h2 { margin:0 0 4px; font-size:22px; color:var(--crema); }
  h3 { margin:0 0 10px; font-size:17px; color:var(--crema); }
  p.nota { color:var(--suave); font-size:14px; margin:4px 0 12px; }
  label { display:block; font-size:13px; color:var(--suave); margin:12px 0 4px; }
  input, textarea, select { width:100%; background:#0a1526; border:1px solid var(--borde); color:var(--texto); border-radius:8px; padding:9px 11px; font:inherit; }
  textarea { min-height:150px; resize:vertical; }
  .fila { display:flex; gap:12px; flex-wrap:wrap; } .fila > div { flex:1; min-width:150px; }
  button.b { background:var(--azul); color:#06121f; border:0; border-radius:8px; padding:9px 16px; font:inherit; font-weight:600; cursor:pointer; }
  button.b.sec { background:none; color:var(--azul); border:1px solid var(--borde); font-weight:400; }
  button.b.mal { background:none; color:var(--mal); border:1px solid var(--borde); font-weight:400; }
  button.b:disabled { opacity:.5; cursor:wait; }
  .botones { display:flex; gap:8px; flex-wrap:wrap; margin-top:14px; }
  .estado { font-size:13px; padding:2px 10px; border-radius:20px; border:1px solid currentColor; white-space:nowrap; }
  .e-espera { color:var(--espera); } .e-ok { color:var(--ok); } .e-mal { color:var(--mal); } .e-gris { color:var(--suave); }
  .cab { display:flex; justify-content:space-between; align-items:center; gap:12px; flex-wrap:wrap; }
  .shorts { display:grid; grid-template-columns:repeat(auto-fill, minmax(220px, 1fr)); gap:14px; margin-top:14px; }
  .short { background:#0a1526; border:1px solid var(--borde); border-radius:10px; padding:10px; display:flex; flex-direction:column; gap:8px; }
  .short.descartado { opacity:.45; } .short.aprobado { border-color:var(--ok); }
  .short video, .short .hueco { width:100%; aspect-ratio:9/16; border-radius:8px; background:#060d18; }
  .short .hueco { display:flex; align-items:center; justify-content:center; color:var(--suave); cursor:pointer; border:1px dashed var(--borde); font-size:15px; }
  .short b { color:var(--crema); } .short small { color:var(--suave); }
  .short .txt { font-size:13px; color:var(--suave); white-space:pre-wrap; }
  .mini { display:flex; gap:6px; flex-wrap:wrap; } .mini button { font-size:13px; padding:5px 10px; }
  details summary { cursor:pointer; color:var(--azul); margin-top:12px; }
  #aviso { position:fixed; bottom:18px; left:50%; transform:translateX(-50%); background:#06121f; border:1px solid var(--azul); padding:10px 18px; border-radius:10px; display:none; max-width:90vw; z-index:9; }
  ol.cola { padding-left:22px; } ol.cola li { margin-bottom:8px; }
  a { color:var(--azul); }
</style>
</head>
<body>
<header><h1>HIDDEN TRIO</h1><span>Panel de shorts</span></header>
<nav id="nav" hidden>
  <button data-v="canciones" class="activa">Canciones</button>
  <button data-v="cola">Cola de publicación</button>
  <button data-v="conexiones">Conexiones</button>
</nav>
<main id="main"></main>
<div id="aviso"></div>
<script src="config.js"></script>
<script>
const C = window.CONFIG, API = `https://api.github.com/repos/${C.repo}`;
const $ = (s, r = document) => r.querySelector(s);
const h = (t) => String(t ?? '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
let clave = localStorage.getItem('ht-clave') || '';
let vista = 'canciones', arbol = [], canciones = [], conexiones = {};

// La clave puede venir en el enlace (#clave=...): se guarda en este navegador y se quita de la barra.
const m = location.hash.match(/clave=([^&]+)/);
if (m) { clave = decodeURIComponent(m[1]); localStorage.setItem('ht-clave', clave); history.replaceState(null, '', location.pathname); }

function aviso(t, ms = 3500) { const a = $('#aviso'); a.textContent = t; a.style.display = 'block'; clearTimeout(aviso.t); aviso.t = setTimeout(() => a.style.display = 'none', ms); }
const b64 = (bytes) => { let s = ''; new Uint8Array(bytes).forEach((b) => s += String.fromCharCode(b)); return btoa(s); };
const deB64 = (s) => Uint8Array.from(atob(s.replace(/\s/g, '')), (c) => c.charCodeAt(0));
const aTexto = (s) => new TextDecoder().decode(deB64(s));
const deTexto = (t) => b64(new TextEncoder().encode(t));

async function gh(ruta, opc = {}) {
  const r = await fetch(API + ruta, { ...opc, cache: 'no-store', headers: { Authorization: `Bearer ${clave}`, Accept: 'application/vnd.github+json', ...(opc.headers || {}) } });
  if (r.status === 401 || r.status === 403) { const e = new Error('clave'); e.clave = true; throw e; }
  return r;
}
async function leer(ruta) { // -> { texto, sha } o null
  const r = await gh(`/contents/${encodeURI(ruta)}?ref=${C.rama}`);
  if (r.status === 404) return null;
  const j = await r.json();
  return { texto: aTexto(j.content), sha: j.sha };
}
async function escribir(ruta, texto, mensaje) {
  const previo = await gh(`/contents/${encodeURI(ruta)}?ref=${C.rama}`);
  const sha = previo.ok ? (await previo.json()).sha : undefined;
  const r = await gh(`/contents/${encodeURI(ruta)}`, { method: 'PUT', body: JSON.stringify({ message: mensaje, content: deTexto(texto), sha, branch: C.rama }) });
  if (!r.ok) throw new Error(`No se pudo guardar (${r.status})`);
}
const json = async (ruta) => { const x = await leer(ruta); try { return x ? JSON.parse(x.texto) : null; } catch { return null; } };

async function cargar() {
  const r = await gh(`/git/trees/${C.rama}?recursive=1`);
  if (!r.ok) throw new Error(`No se pudo leer el panel (${r.status})`);
  arbol = (await r.json()).tree;
  const ids = [...new Set(arbol.map((f) => (f.path.match(/^canciones\/([^/]+)\/cancion\.json$/) || [])[1]).filter(Boolean))];
  canciones = await Promise.all(ids.map(async (id) => {
    const [c, res, dec, letra] = await Promise.all([json(`canciones/${id}/cancion.json`), json(`canciones/${id}/resultado.json`), json(`canciones/${id}/decisiones.json`), leer(`canciones/${id}/letra.txt`)]);
    return { id, ...c, res: res || {}, dec: dec || {}, letra: letra ? letra.texto : '' };
  }));
  canciones.sort((a, b) => (b.creado || '').localeCompare(a.creado || ''));
  conexiones = {};
  for (const f of arbol) { const k = (f.path.match(/^conexiones\/(\w+)\.json$/) || [])[1]; if (k) conexiones[k] = true; }
}

function estadoDe(c) {
  if (c.res.pedido_id !== c.pedido?.id) return c.res.estado === 'generando' && c.res.generando_id === c.pedido?.id ? ['Generando…', 'espera'] : ['En cola', 'espera'];
  if (c.res.estado === 'error') return ['Falló', 'mal'];
  return [`${(c.res.shorts || []).length} shorts listos`, 'ok'];
}

function pintar() {
  $('#nav').hidden = false;
  document.querySelectorAll('nav button').forEach((b) => b.classList.toggle('activa', b.dataset.v === vista));
  ({ canciones: pintarCanciones, cola: pintarCola, conexiones: pintarConexiones })[vista]();
}

function pintarEntrada(error) {
  $('#nav').hidden = true;
  $('#main').innerHTML = `<div class="caja" style="max-width:520px;margin:40px auto">
    <h2>Entrar</h2><p class="nota">${error ? 'Esa clave no vale o ha caducado. ' : ''}Pega la clave del panel que te ha pasado Lucas. Se guarda solo en este navegador.</p>
    <input id="k" type="password" placeholder="Clave del panel" autocomplete="off">
    <div class="botones"><button class="b" id="entrar">Entrar</button></div></div>`;
  $('#entrar').onclick = () => { clave = $('#k').value.trim(); localStorage.setItem('ht-clave', clave); arrancar(); };
}

function pintarCanciones() {
  $('#main').innerHTML = `
  <div class="caja">
    <h2>Nueva canción</h2>
    <p class="nota">Sube el vídeo del disco girando a YouTube, pega aquí el enlace y la letra, y los shorts se hacen solos. Tardan entre unos minutos y una hora en aparecer (los monta el ordenador de Lucas en su siguiente pasada).</p>
    <div class="fila"><div><label>Título de la canción</label><input id="n-titulo" placeholder="Leave the Light On"></div>
      <div><label>Disco (opcional)</label><input id="n-disco" placeholder="Nombre del disco"></div></div>
    <label>Enlace del vídeo en YouTube</label><input id="n-yt" placeholder="https://www.youtube.com/watch?v=...">
    <label>Letra (un verso por línea; sirve para que los subtítulos salgan sin erratas)</label><textarea id="n-letra" placeholder="Leave the light on&#10;I wanna see you dance&#10;..."></textarea>
    <div class="fila"><div><label>Cuántos shorts</label><select id="n-n"><option>3</option><option>4</option><option selected>5</option><option>6</option></select></div>
      <div><label>Duración de cada uno</label><select id="n-dur"><option value="20">20 s</option><option value="30" selected>30 s</option><option value="45">45 s</option></select></div></div>
    <div class="botones"><button class="b" id="n-ok">Añadir a la cola</button></div>
  </div>
  ${canciones.length ? '' : '<p class="nota">Todavía no hay canciones.</p>'}
  ${canciones.map((c) => { const [t, cls] = estadoDe(c); return `
  <div class="caja" data-id="${h(c.id)}">
    <div class="cab"><div><h3 style="margin:0">${h(c.titulo)}</h3><small class="nota">${c.disco ? h(c.disco) + ' · ' : ''}<a href="${h(c.youtube)}" target="_blank" rel="noopener">vídeo en YouTube</a></small></div>
      <span class="estado e-${cls}">${t}</span></div>
    ${c.res.estado === 'error' && c.res.pedido_id === c.pedido?.id ? `<p class="nota" style="color:var(--mal)">${h(c.res.error)}</p>` : ''}
    <div class="shorts">${(c.res.shorts || []).map((s) => { const d = c.dec[s.fichero]?.estado || 'nuevo'; return `
      <div class="short ${d}" data-f="${h(s.fichero)}">
        <div class="hueco" data-ver>▶ Ver</div>
        <div><b>${h(s.titulo || s.tipo)}</b><br><small>${h(tipo(s.tipo))} · del ${s.desde} al ${s.hasta} s</small></div>
        <div class="txt">${h([s.descripcion, s.hashtags].filter(Boolean).join('\n\n') || s.letra)}</div>
        <div class="mini">
          <button class="b ${d === 'aprobado' ? '' : 'sec'}" data-dec="aprobado">${d === 'aprobado' ? '✓ Aprobado' : 'Aprobar'}</button>
          <button class="b mal" data-dec="descartado">${d === 'descartado' ? 'Descartado' : 'Descartar'}</button>
          <button class="b sec" data-copiar>Copiar texto</button>
          <button class="b sec" data-bajar>Descargar</button>
        </div>
      </div>`; }).join('')}</div>
    <details><summary>Letra y volver a generar</summary>
      <label>Letra</label><textarea data-letra>${h(c.letra)}</textarea>
      <div class="fila"><div><label>Cuántos shorts</label><select data-n>${[3, 4, 5, 6].map((n) => `<option ${n === (c.pedido?.n || 5) ? 'selected' : ''}>${n}</option>`).join('')}</select></div>
        <div><label>Duración</label><select data-dur>${[20, 30, 45].map((n) => `<option value="${n}" ${n === (c.pedido?.dur || 30) ? 'selected' : ''}>${n} s</option>`).join('')}</select></div></div>
      <div class="botones"><button class="b sec" data-letra-ok>Guardar la letra</button><button class="b" data-regen>Guardar y generar de nuevo</button></div>
      <p class="nota">Al generar de nuevo se sustituyen los shorts de esta canción y se borran los aprobados.</p>
    </details>
  </div>`; }).join('')}`;

  $('#n-ok').onclick = (e) => conBoton(e.target, async () => {
    const titulo = $('#n-titulo').value.trim(), yt = $('#n-yt').value.trim();
    if (!titulo || !/^https?:\/\/(www\.|m\.)?(youtube\.com|youtu\.be)\//.test(yt)) return aviso('Falta el título o el enlace de YouTube.');
    let id = titulo.toLowerCase().normalize('NFD').replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '') || 'cancion';
    if (canciones.some((c) => c.id === id)) id += '-' + Date.now().toString(36);
    const ahora = new Date().toISOString();
    if ($('#n-letra').value.trim()) await escribir(`canciones/${id}/letra.txt`, $('#n-letra').value.trim() + '\n', `letra de ${titulo}`);
    await escribir(`canciones/${id}/cancion.json`, JSON.stringify({ titulo, disco: $('#n-disco').value.trim(), youtube: yt, creado: ahora, pedido: { id: ahora, n: +$('#n-n').value, dur: +$('#n-dur').value } }, null, 1), `nueva canción: ${titulo}`);
    aviso('Añadida a la cola.'); await recargar();
  });

  document.querySelectorAll('.caja[data-id]').forEach((caja) => {
    const c = canciones.find((x) => x.id === caja.dataset.id);
    const guardarLetra = () => escribir(`canciones/${c.id}/letra.txt`, $('[data-letra]', caja).value.trim() + '\n', `letra de ${c.titulo}`);
    $('[data-letra-ok]', caja).onclick = (e) => conBoton(e.target, async () => { await guardarLetra(); aviso('Letra guardada. Se usará la próxima vez que se generen.'); });
    $('[data-regen]', caja).onclick = (e) => conBoton(e.target, async () => {
      await guardarLetra();
      const { id, res, dec, letra, ...resto } = c;
      await escribir(`canciones/${c.id}/cancion.json`, JSON.stringify({ ...resto, pedido: { id: new Date().toISOString(), n: +$('[data-n]', caja).value, dur: +$('[data-dur]', caja).value } }, null, 1), `generar de nuevo: ${c.titulo}`);
      await escribir(`canciones/${c.id}/decisiones.json`, '{}', `decisiones a cero: ${c.titulo}`);
      aviso('En cola para generarse de nuevo.'); await recargar();
    });
    caja.querySelectorAll('.short').forEach((el) => {
      const s = c.res.shorts.find((x) => x.fichero === el.dataset.f);
      const video = async () => {
        const f = arbol.find((x) => x.path === `canciones/${c.id}/shorts/${s.fichero}`);
        if (!f) throw new Error('El vídeo todavía no está subido.');
        const r = await gh(`/git/blobs/${f.sha}`, { headers: { Accept: 'application/vnd.github.raw' } });
        return URL.createObjectURL(new Blob([await r.arrayBuffer()], { type: 'video/mp4' }));
      };
      $('[data-ver]', el).onclick = async (e) => { e.target.textContent = 'Cargando…'; try { const v = document.createElement('video'); v.src = await video(); v.controls = true; v.autoplay = true; e.target.replaceWith(v); } catch (x) { fallo(x); e.target.textContent = '▶ Ver'; } };
      $('[data-bajar]', el).onclick = (e) => conBoton(e.target, async () => { const a = document.createElement('a'); a.href = await video(); a.download = `${c.id}-${s.fichero}`; a.click(); });
      $('[data-copiar]', el).onclick = () => navigator.clipboard.writeText([s.titulo, s.descripcion, s.hashtags].filter(Boolean).join('\n\n') || s.letra).then(() => aviso('Texto copiado.'));
      el.querySelectorAll('[data-dec]').forEach((b) => b.onclick = (e) => conBoton(e.target, async () => {
        const actual = c.dec[s.fichero]?.estado;
        if (actual === b.dataset.dec) delete c.dec[s.fichero]; else c.dec[s.fichero] = { estado: b.dataset.dec, cuando: new Date().toISOString() };
        await escribir(`canciones/${c.id}/decisiones.json`, JSON.stringify(c.dec, null, 1), `${b.dataset.dec}: ${c.titulo} ${s.fichero}`);
        pintar();
      }));
    });
  });
}

function pintarCola() {
  const cola = canciones.flatMap((c) => (c.res.shorts || []).filter((s) => c.dec[s.fichero]?.estado === 'aprobado').map((s) => ({ c, s, cuando: c.dec[s.fichero].cuando }))).sort((a, b) => a.cuando.localeCompare(b.cuando));
  const hay = ['youtube', 'tiktok', 'instagram'].filter((k) => conexiones[k]);
  $('#main').innerHTML = `<div class="caja"><h2>Cola de publicación</h2>
    <p class="nota">Los shorts que apruebas en «Canciones» se ponen aquí, por orden de aprobación. ${hay.length ? `Cuentas con acceso guardado: ${hay.join(', ')}.` : 'Todavía no hay ninguna cuenta conectada (pestaña «Conexiones»).'} La publicación automática aún no está encendida: de momento, descárgalos y súbelos a mano con su texto.</p>
    ${cola.length ? `<ol class="cola">${cola.map((x) => `<li><b>${h(x.c.titulo)}</b> · ${h(x.s.titulo || x.s.tipo)} <small class="nota">(${h(x.s.fichero)}, aprobado el ${new Date(x.cuando).toLocaleDateString('es')})</small></li>`).join('')}</ol>` : '<p class="nota">No hay ninguno aprobado.</p>'}</div>`;
}

const TIPOS = { subida: 'Subida al estribillo', drop: 'Drop', energia: 'Momento más fuerte', puente: 'Puente' };
const tipo = (t) => TIPOS[t] || t.replace(/^estribillo(\d+)$/, 'Estribillo $1');
const REDES = [
  ['youtube', 'YouTube', 'El canal de Hidden Trio. Hace falta que el dueño del canal dé permiso a la aplicación de subida; se hace una vez con Lucas en una llamada. Si ya tienes los datos (client id, client secret y refresh token), pégalos aquí.'],
  ['tiktok', 'TikTok', 'La cuenta de TikTok del grupo. Apunta aquí el usuario y, si ya existen, los datos de acceso de la aplicación de publicación.'],
  ['instagram', 'Instagram', 'Tiene que ser cuenta profesional (creador o empresa) enlazada a una página de Facebook. Apunta aquí el usuario y, si ya existen, el identificador de la cuenta y el token de acceso.'],
];
function pintarConexiones() {
  $('#main').innerHTML = `<div class="caja"><h2>Conexiones</h2>
    <p class="nota">Lo que escribas aquí se cifra en tu navegador antes de guardarse: solo se puede leer en el ordenador de Lucas, que es el que publica. No se puede volver a ver desde el panel; si te equivocas, guárdalo otra vez entero.</p></div>
    ${REDES.map(([k, nombre, ayuda]) => `<div class="caja"><div class="cab"><h3 style="margin:0">${nombre}</h3><span class="estado e-${conexiones[k] ? 'ok' : 'gris'}">${conexiones[k] ? 'Acceso guardado' : 'Sin conectar'}</span></div>
      <p class="nota">${ayuda}</p><textarea data-red="${k}" style="min-height:90px" placeholder="Usuario, claves o lo que te hayan dado para ${nombre}" autocomplete="off"></textarea>
      <div class="botones"><button class="b" data-guardar="${k}">Guardar cifrado</button></div></div>`).join('')}`;
  document.querySelectorAll('[data-guardar]').forEach((b) => b.onclick = (e) => conBoton(e.target, async () => {
    const k = b.dataset.guardar, texto = $(`[data-red="${k}"]`).value.trim();
    if (!texto) return aviso('Está vacío.');
    await escribir(`conexiones/${k}.json`, JSON.stringify({ ...(await cifrar(texto)), cuando: new Date().toISOString() }, null, 1), `acceso de ${k}`);
    aviso('Guardado y cifrado.'); await recargar();
  }));
}

// Cifrado híbrido con WebCrypto: clave AES de un solo uso, envuelta con la pública RSA del panel.
async function cifrar(texto) {
  const pub = await crypto.subtle.importKey('spki', deB64(C.clavePublica), { name: 'RSA-OAEP', hash: 'SHA-256' }, false, ['encrypt']);
  const aes = await crypto.subtle.generateKey({ name: 'AES-GCM', length: 256 }, true, ['encrypt']);
  const iv = crypto.getRandomValues(new Uint8Array(12));
  const datos = await crypto.subtle.encrypt({ name: 'AES-GCM', iv }, aes, new TextEncoder().encode(texto));
  const claveAes = await crypto.subtle.encrypt({ name: 'RSA-OAEP' }, pub, await crypto.subtle.exportKey('raw', aes));
  return { clave: b64(claveAes), iv: b64(iv), datos: b64(datos) };
}

function fallo(e) { if (e.clave) { pintarEntrada(true); } else { aviso(e.message || String(e), 6000); } }
async function conBoton(boton, f) { boton.disabled = true; try { await f(); } catch (e) { fallo(e); } finally { boton.disabled = false; } }
async function recargar() { await cargar(); pintar(); }
async function arrancar() {
  if (!clave) return pintarEntrada(false);
  $('#main').innerHTML = '<p class="nota">Cargando…</p>';
  try { await recargar(); } catch (e) { fallo(e); }
}
document.querySelectorAll('nav button').forEach((b) => b.onclick = () => { vista = b.dataset.v; pintar(); });
setInterval(() => { if (clave && vista !== 'conexiones' && !document.querySelector('video, details[open]') && !document.activeElement.matches('input, textarea, select') && ![...document.querySelectorAll('#n-titulo, #n-yt, #n-letra')].some((x) => x.value)) recargar().catch(() => {}); }, 60000);
arrancar();
</script>
</body>
</html>
